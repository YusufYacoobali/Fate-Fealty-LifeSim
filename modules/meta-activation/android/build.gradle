plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.metaactivation'
version = '0.1.0'

dependencies {
  implementation "com.facebook.android:facebook-core:${rootProject.ext.has('facebookSdkVersion') ? rootProject.ext.get('facebookSdkVersion') : '18.3.0'}"
}

android {
  namespace "expo.modules.metaactivation"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
