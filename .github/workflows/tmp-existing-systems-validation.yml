name: Temporary existing-system validation

on:
  pull_request:
    branches:
      - v4
  push:
    branches:
      - v4-existing-systems-polish

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand src/__tests__/existingSystemsPolish.test.ts
